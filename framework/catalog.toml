[[capability]]
id = "validation"
name = "Validation on both sides"
layer = "primitive"
status = "available"
summary = "Every verb's inputs reach the client with the rules its Ash action enforces (required, lengths, regex, ranges, one_of, uuid, dates, Mana.BR formats and uniqueness); a field checks them as the user types, and the server's refusal lands on the field it names."
keywords = ["validation", "validate", "field", "input", "rule", "required", "length", "mask", "keyboard", "field error", "form"]
use = "Server: nothing new — constraints on the action's attributes and arguments are the rules. Client: BookingVerbs.counter.input('counter_note') gives a VerbInput; in Flutter (mana_command) TextFormField(validator: input.validator(message), keyboardType: input.keyboard, inputFormatters: input.formatters) and send input.value(text); on a refusal verbFieldErrors(response.data) maps codes to fields; a unique input (a single-attribute identity) gets uniqueValidator(input, taken) — debounced, the server still decides. Plain checks: input.check(value)."
replaces = ["maxLength and regexes copied into widgets", "hand-written CPF/CEP masks and validators", "a server error shown in a banner instead of on its field"]
docs = "framework/ash/core/lib/mana/verbs.ex"

