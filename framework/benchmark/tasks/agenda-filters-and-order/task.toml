[[check]]
id = "hosts"
cwd = "apps/hosts"
run = ["flutter", "test", "test/features/host/operations/host_operations_view_model_test.dart"]

[[heldout]]
id = "hosts"
cwd = "apps/hosts"
run = ["flutter", "test", "{files}"]
files = "apps/hosts/test/**/*_test.dart"
count = '-(\d+): Some tests failed'
