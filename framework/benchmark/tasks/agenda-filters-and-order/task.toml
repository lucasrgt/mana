kind = "ui"
summary = "The hosts' agenda: day chips, the past filter, the order, kept filters and honest failures"
commit = "0dbb623c0d94f5bc6cc13fb405bffc9087e268da"
revert = ["apps/hosts/lib/features/host/operations/**", "apps/hosts/lib/app.dart"]
