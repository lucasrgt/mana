name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  elixir:
    name: Elixir · ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [br, contracts, core, lint, moments, runtime, session, upgrade]
    # The digest of framework/ash/toolchain/Dockerfile: Elixir 1.18.4, OTP 27.3.4.18.
    container:
      image: elixir@sha256:09b37446f1b24a280890c4b294eec6a53ba2501a2289959b483d849035e1053c
    services:
      postgres:
        image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mana_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MIX_ENV: test
      MANA_TEST_POSTGRES: ecto://postgres:postgres@postgres:5432/mana_test
    defaults:
      run:
        working-directory: framework/ash/${{ matrix.package }}
    steps:
      - name: Toolchain packages (as in framework/ash/toolchain/Dockerfile)
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            framework/ash/${{ matrix.package }}/deps
            framework/ash/${{ matrix.package }}/_build
          key: mix-${{ matrix.package }}-${{ hashFiles('framework/ash/toolchain/Dockerfile', format('framework/ash/{0}/mix.lock', matrix.package)) }}
          restore-keys: mix-${{ matrix.package }}-
      - run: mix local.hex 2.6.0 --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked
      # Fails on a retired package or a security advisory for any locked version.
      - run: mix hex.audit
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix compile --warnings-as-errors
      - run: mix test --warnings-as-errors

  dart:
    name: Dart · ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [cli, moments]
    defaults:
      run:
        working-directory: framework/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.3
      - run: dart pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed bin lib test
      - run: dart analyze
      - run: dart test

  flutter:
    name: Flutter · ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - ash_session
          - devtools
          - live_ui
          - mana_br
          - mana_command
          - mana_lints
          - mana_live
          - mana_primitives
          - mana_storage
    defaults:
      run:
        working-directory: framework/flutter/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      # A library that ignores its lockfile (ash_session) resolves like its consumers do.
      - run: |
          if git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1; then
            flutter pub get --enforce-lockfile
          else
            flutter pub get
          fi
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - name: flutter test
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test folder in ${{ matrix.package }}"
          fi

  first-green:
    name: mana new to a green suite in 5 minutes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The starter pins this checkout's commit as its mana/ submodule, cloned locally.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.4
      # `mana client generate` runs the pinned OpenAPI Generator jar.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - run: |
          git config --global user.name "Mana CI"
          git config --global user.email "ci@mana.invalid"
      - run: .github/scripts/first-green.sh "$RUNNER_TEMP/first-green" 300

  skill:
    name: Agent skill matches the catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.3
      - run: framework/cli/mana capabilities skill --check
