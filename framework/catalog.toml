summary = "Change one condition of a running app without editing it: net: makes matching API calls answer offline, api-error, slow or empty (the AVP conditions); latency: delays matching requests on the server; fn: makes a defexample function raise or answer a value; clock runs now the deadlines and stuck-flow checks that would come due; replay with rewritten params answers what would have happened if."
keywords = ["intervention", "simulate offline", "no network", "api error", "slowness", "slow", "clock", "advance time", "deadline", "what if", "counterfactual", "chaos", "mock"]
use = "Client (Moments builds only): --dart-define=MANA_INTERVENE='net:/api/notifications/*=offline;net:/api/**=slow:1500' or MomentIntervention.set([...]) (attach it in the app's account package). Server (dev, config :mana_core, :interventions, true): MANA_INTERVENE=\"latency:/api/operations/**=1500;fn:MyApp.Operations.Actions.priced=raise\" or Mana.Intervene.Rules.set([...]); clock: Mana.Intervene.advance(Repo, {3, :day}) or mix mana.advance 3d (not in production). Counterfactual: Mana.History.replay(Resource, entries, params: fn action, params -> Map.put(params, ...) end)."
replaces = ["mocking the network by hand in each test", "waiting for a real deadline to pass", "editing code to see what an error does to a screen"]
docs = "framework/ash/core/lib/mana/intervene.ex"

[[capability]]
