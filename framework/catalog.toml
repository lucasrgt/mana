# The Mana catalog: every piece of the framework, how to use it, and what it
# replaces. `mana capabilities` reads this file; the agent skill
# (framework/agents/skills/mana/SKILL.md) is generated from it. A piece that is
# not here does not exist for agents, so add an entry when a piece lands.
#
# status: "available" (use it) or "planned" (do not use; listed so agents do
# not rebuild it by hand in the meantime).
version = 1

[[capability]]
id = "features"
name = "Feature map"
layer = "coordinate"
status = "available"
summary = "The shared feature:<name> address: which files, verbs, Moments and sensors belong to each product feature, and where the trio has gaps."
keywords = ["feature", "owner", "file", "review", "PR", "coverage", "gap"]
use = "mana features which <path> before editing; mana features show <name> for its files and Moments; mana features changed to review a diff by feature; mana features coverage [name] for verbs no Moment exercises, features with Moments but no verbs and verbs without a declared feature (verb feature: \"name\"). Declare new files in features.toml. mana features remove <name> [--apply] plans (and applies) removing a feature: deletes files only it owns, keeps shared ones, lists its Moments and the verbs still naming it."
replaces = ["guessing a feature's files by grep", "reviewing a PR file by file"]
detector = "mana doctor and mana features check fail on unowned files"
docs = "framework/cli/README.md"

