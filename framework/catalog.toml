status = "available"
summary = "Every create, update and destroy of a resource is recorded as it happens — who (user, system deadline or agent), which verb, inputs, before and after, failed attempts with their error code — in a log resource with its own retention; a record's history answers only to whoever may read the record."
keywords = ["history", "audit", "log", "who did it", "timeline", "activity", "feed", "track changes", "replay", "reproduce", "recreate"]
use = "Log: a resource with extensions: [Mana.History.Log, Mana.Resource]; history_log do subjects [MyApp.Booking] end; retention do delete_after :at, days: 730 end; route index :of, route: \"/:subject_type/:subject_id\". Subject: extensions: [Mana.History]; history do log MyApp.HistoryEntry; redact [:secret] end; verb ..., narrate: \"cancelled the booking\". Agent changes: pass context: %{mana_agent: \"name\"}. Replay: Mana.History.fixture(Log, \"booking\", id, %{user_id => \"host\"}) exports the entries with roles (commit it, e.g. backend/priv/moments/replays/*.json); Mana.History.replay(Booking, entries, actor: %{\"host\" => host, \"traveler\" => traveler}, params: fn action, params -> ... end) rebuilds a new record that ends where it ended — a Moment recipe built on it is hosts:host-replayed-counter. Flutter: ManaHistoryEntry.fromJson(attributes) and HistoryTimeline(entries:, entry:) from mana_command. Mana.History.note(resource, id, %{action:, via:, outcome:}) records what happened around a record (deliveries, webhooks; replay skips notes). Time travel: the log's :as_of action (route it) answers the record as it stood at a moment. A failure reported to error_reporter keeps the report id; telemetry [:mana, :history, :entry] and mix mana.history.export --since feed the warehouse. Flutter: HistoryView (Undo on the newest change whose inverse is offered; tap an entry for as-of)."
replaces = ["audit tables written by hand in each action", "activity feeds assembled from status columns", "analytics events duplicated next to the change"]
docs = "framework/ash/core/lib/mana/history.ex"

[[capability]]
id = "recovery"
name = "Declared recovery"
layer = "primitive"
status = "available"
summary = "Each verb declares how it survives failure: retry: n resends transient failures, offline: :queue keeps it in a device queue that survives restarts (only idempotent verbs, never money — compile-time rules); screens never test connectivity; on the server, run_all undoes done steps through their inverse when a later one fails."
keywords = ["offline", "no network", "no internet", "queue", "retry", "try again", "resend", "connection", "compensate", "saga", "network failure"]
use = "Server: verb :mark_read, idempotent: true, retry: 2, offline: :queue; Mana.Verbs.run_all([{record, :verb, params}, ...], actor) compensates. Flutter: deviceVerbRunner(slot:, verbs: NotificationVerbs.all, send:) from the app's account package (VerbRunner in mana_command) — run(verb, id) answers done/queued/failed, flush() on load, stateOf(verb, id) for the button. Every call is covered without wrapping it: the contract marks each operation with the verbs it performs (x-mana-verb), the client generates ManaOperations.all, and the account installs VerbPolicy (Dio), which resends a transient failure up to the verb's retry and keeps an offline: :queue call on the device (answered 202) until the API answers again. Mana.Reconcile escalate: config :mana_core, :reconcile_escalate, {Mod, :fun} receives every rule's report of each run (open an operator case on diverging, close it on converged)."
replaces = ["if (connectivity) checks in screens", "hand-written retry loops", "a queued payment replayed twice", "sagas coded per flow"]
docs = "framework/flutter/mana_command/lib/src/verb_runner.dart"

[[capability]]
id = "flows"
name = "Flows"
layer = "primitive"
status = "available"
summary = "A multi-step journey kept on the record (onboarding, checkout, KYC): the server moves a cursor through declared steps — refusing steps not reached, passing over skip_if steps, never moving back — so it resumes on any device; records expose flow progress, funnel/1 counts each step, and when a step stalls a durable job diagnoses it from the record's history — :bug (technical failures) or :abandoned (no attempt, or refused inputs then silence) — emits [:mana, :flow, :stuck] telemetry and calls on_stuck(record, step, diagnosis)."
keywords = ["flow", "step", "onboarding", "sign up", "wizard", "progress", "resume", "abandonment", "funnel", "stuck", "diagnosis", "dropped off"]
use = "Server: extensions: [Mana.Flow]; flow do cursor :lifecycle_state; step :terms_pending, action: :advance_terms; step :address_pending, action: :save_address, skip_if: expr(...); done :complete; stuck_after {2, :day}; on_stuck {MyApp.Hosts.Actions, :remind_onboarding}; not_reached {MyApp.Hosts, :error, [:previous_step_incomplete]}; queue :maintenance end; load :flow in the read. Mana.Flow.funnel(Resource). Client: HostFlow.flow (ManaFlow) — stepOf/indexOf/progress of the record's cursor. stuck_after may be {Mod, :fun} returning {amount, unit} when the step is entered (a knob). Flutter: FlowScreens<S>(XFlow.flow, [(screen, step or null)]) lays the app's screens over the journey (resume(cursor, passed:), progress, previous/next); FlowBuilder draws the current one with its position."
replaces = ["a Step change per action that moves an enum by hand", "progress computed in the app", "a cron that looks for abandoned signups"]
docs = "framework/ash/core/lib/mana/flow.ex"

[[capability]]
id = "notifications"
name = "Notifications"
layer = "primitive"
status = "available"
summary = "The notices a resource sends are declared next to the actions that cause them — recipient (attribute or :counterpart from Mana.Entity's audience, never the actor), template, category, channels, deep link — and go out after the action succeeds through the app's sender; clients follow the declared link and group preferences by category."
keywords = ["notification", "notice", "push", "email", "inbox", "notify", "reminder", "deep link", "preferences", "quiet hours", "group", "fallback", "sms"]
use = "Server: extensions: [Mana.Notifications]; notifications do sender MyApp.Notifications.Sender; notify :accept, to: :traveler_id, template: \"reservation.confirmed\", category: :reservations, opens: \"/traveler/reservations?booking=:id\", channels: [:inbox, :email]; notify :cancel, to: :counterpart, template: ... end; payload: [:city, :rejection_reason] copies attributes into the notice for the template's {city} text; when the recipient or the data is not on the record, to: {Mod, :fun} and payload: {Mod, :fun} compute them from it. Sender: @behaviour Mana.Notifications.Sender; deliver(%{to:, template:, channels:, payload:, record:}) → :ok | {:error, _}. Delivery rules in the section: preferences {Mod, :allows?} (user, category, channel; inbox always kept), quiet_hours {Mod, :until} (outbound channels held as a job), group_within {10, :minute} (repeats about the same record go to the inbox only), and per notice fallback: true (try channels in order until one delivers). Flutter: ManaNotification.of(BookingNotifications.all, templateKey)?.link(payload). Notices go out after the action commits; each delivery joins the record's history (sent, failed, held). A sender may answer {:failed, [{channel, reason}]}. Flutter: ManaNotices.all (generated) gives a delivery's category and link; InboxController (filter, unread, optimistic read); notificationChoices + NotificationPreferences for category x channel switches."
replaces = ["notify! calls inside each action", "who-gets-it rules duplicated per action", "notification taps routed by guessing from the template", "opt-out checks inside each mail", "repeated emails about the same record", "hand-rolled push-then-email fallbacks"]
docs = "framework/ash/core/lib/mana/notifications.ex"

[[capability]]
id = "checkpoint"
name = "Agent checkpoints"
layer = "verification"
status = "available"
summary = "An agent's plan of verb steps runs first as a dry run inside a transaction that is always rolled back — reporting the history it would write, the notices it would send (none delivered) and the outcome — and is kept only with a passing AVP verdict, compensating through inverses on failure; money steps are refused as irreversible."
keywords = ["checkpoint", "dry run", "simulate", "test first", "rollback", "undo", "keep", "agent", "plan", "irreversible"]
use = "mix mana.checkpoint --plan plan.json --actor <user id> --actor-resource MyApp.Accounts.User (dry run); add --keep --verdict .mana/sense/<run>/verdict.json to apply. In code: Mana.Checkpoint.dry_run(plan, actor) / keep(plan, actor, verdict). Plan: [{\"resource\": \"MyApp.Operations.Booking\", \"id\": ..., \"verb\": \"accept\", \"params\": {}}]."
replaces = ["trying a data change for real to see what happens", "asking a person to confirm every agent action", "manual cleanup after an agent experiment"]
docs = "framework/ash/core/lib/mana/checkpoint.ex"

[[capability]]
id = "agent-verbs"
name = "Agent over verbs"
layer = "core"
status = "available"
summary = "Agents act on the running app the way its screens do: open an entry (a view declared with entry:) and get its records with the verbs each offers now and their inputs; follow one of those verbs and get the record after. A verb not offered cannot be followed; follows are recorded in history as the agent's. Served over HTTP by Mana.Agent.Plug and to MCP clients by mana mcp."
keywords = ["agent", "mcp", "tool", "hateoas", "open", "follow", "automation", "assistant", "operate the app"]
use = "Server: views do view :agenda_card, fields: [...], entry: :as_host end; forward \"/agent\", Mana.Agent.Plug, domains: [...] behind authentication. Agent: MANA_AGENT_TOKEN=<access token> framework/cli/mana mcp --api http://127.0.0.1:5318 --agent planner (tools entries, open, follow). In code: Mana.Agent.open/4, Mana.Agent.follow/7."
replaces = ["one MCP tool per endpoint", "agents calling actions the screen would not offer", "dumping whole tables into an agent's context"]
docs = "framework/ash/core/lib/mana/agent.ex"

[[capability]]
id = "knobs"
name = "Knobs"
layer = "primitive"
status = "available"
summary = "Values that change while the app runs, often by someone who is not a developer: declared and typed in code with a default (a value or an MFA, so configuration stays the fallback), only the current value stored (with history of who changed it), gradual rollout to listed actors or a percent, verbs gated server-side by a knob, and stale knobs listed for removal."
keywords = ["knob", "flag", "feature flag", "toggle", "switch", "kill switch", "live configuration", "rollout", "percentage", "no deploy", "tuning"]
use = "Server: defmodule MyApp.Knobs do use Mana.Knobs, store: MyApp.KnobValue; knob :platform_checkout_enabled, :boolean, default: {MyApp.Payments, :configured, [:platform_checkout_enabled]}, feature: \"payments\" end; the store resource uses extensions: [Mana.Knobs.Store, Mana.History]; config :mana_core, :knobs, MyApp.Knobs. Read MyApp.Knobs.get(:name) / enabled?(:name, actor); set(:name, value | %{\"value\", \"actors\", \"percent\"}, by); unset(:name); stale(). Verb: verb :apply_coupon, knob: :coupons_enabled. Expose GET/POST routes for operators when they need to change knobs from an admin screen. Ask first: does a non-developer need to change it while the app runs? If not, it is configuration. Number knobs take min: and max:, and set refuses values outside them. knob :reviews_enabled, :boolean, enables: \"reviews\" turns every verb of that feature (and its sub-features) on and off on the server and in what is offered."
replaces = ["redeploying to flip a setting", "hiding a button while the server still accepts the action", "flags nobody remembers to remove"]
docs = "framework/ash/core/lib/mana/knobs.ex"

